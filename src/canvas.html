<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FrameX Canvas - Create and edit diagrams with our powerful digital whiteboard. Features include shapes, SVGs, auto-save, and more."
    />
    <meta
      name="keywords"
      content="digital whiteboard, diagramming tool, flowchart maker, wireframe tool, visual collaboration, online drawing tool, diagram software, free diagram tool"
    />
    <meta name="author" content="Samita Mondal" />
    <title>FrameX | Canvas</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/images/FrameX-Logo.svg"
    />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XJW4NTLH7G"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-XJW4NTLH7G");
    </script>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Floating Logo -->
    <div class="floating-logo">
      <a href="/"
        ><img src="./assets/images/FrameX-Logo.svg" alt="Logo" height="40"
      /></a>
    </div>

    <!-- Top Right Controls -->
    <div class="top-right-controls">
      <span class="save-status">
        <img
          src="./assets/icons/save-file.svg"
          alt="Saved"
          class="save-status-icon"
          style="display: none"
        />
        <img
          src="./assets/icons/refresh.svg"
          alt="Saving"
          class="save-status-icon saving"
          style="display: none"
        />
        <img
          src="./assets/icons/delete-canvas.svg"
          alt="Cleared"
          class="save-status-icon"
          style="display: none"
        />
        <span class="save-status-text">All Changes Saved</span>
      </span>
      <button
        class="btn-export"
        id="exportBtn"
        title="Export (Ctrl/Cmd E)"
        data-bs-toggle="modal"
        data-bs-target="#exportModal"
      >
        Export
      </button>
      <button class="btn-clear" id="clearBtn">Clear</button>
    </div>

    <!-- Left Toolbar -->
    <div class="left-toolbar">
      <button class="toolbar-btn active" id="selectTool" title="Select">
        <img src="./assets/icons/select.svg" alt="Select" />
      </button>
      <button class="toolbar-btn" id="pencilTool" title="Pencil">
        <img src="./assets/icons/pencil.svg" alt="Pencil" />
      </button>
      <button class="toolbar-btn" id="stickyTool" title="Sticky Note">
        <img src="./assets/icons/sticky.svg" alt="Sticky" />
      </button>
      <button class="toolbar-btn" id="textTool" title="Text">
        <img src="./assets/icons/text.svg" alt="Text" />
      </button>
      <button class="toolbar-btn" id="shapesTool" title="Shapes">
        <img src="./assets/icons/shapes.svg" alt="Shapes" />
      </button>
      <div class="toolbar-divider"></div>
      <button class="toolbar-btn" id="undoTool" title="Undo">
        <img src="./assets/icons/undo.svg" alt="Undo" />
      </button>
      <button class="toolbar-btn" id="redoTool" title="Redo">
        <img src="./assets/icons/redo.svg" alt="Redo" />
      </button>
    </div>

    <!-- Floating Shapes Menu -->
    <div
      class="floating-shapes-menu"
      id="floatingShapesMenu"
      style="display: none"
    >
      <div class="shapes-menu-top-row">
        <button class="shape-menu-btn" id="addLine" title="Line">
          <img src="./assets/icons/line.svg" alt="Line" />
        </button>
        <!--
          Arrow, Polyline and Curved Arrow are placeholders for Phase 3
          (see docs/TASKS.md P3-2): no icon asset and no ShapeManager
          method exist yet, so the controls are hidden rather than left
          as dead buttons.
        -->
        <button
          class="shape-menu-btn"
          id="addArrow"
          title="Arrow"
          style="display: none"
        >
          <img src="./assets/icons/arrow.svg" alt="Arrow" />
        </button>
        <button
          class="shape-menu-btn"
          id="addPolyline"
          title="Polyline"
          style="display: none"
        >
          <img src="./assets/icons/polyline.svg" alt="Polyline" />
        </button>
        <button
          class="shape-menu-btn"
          id="addCurvedArrow"
          title="Curved Arrow"
          style="display: none"
        >
          <img src="./assets/icons/curved-arrow.svg" alt="Curved Arrow" />
        </button>
      </div>
      <hr class="shapes-menu-divider" />
      <div class="shapes-menu-grid">
        <button class="shape-menu-btn" id="addSquare" title="Square">
          <img src="./assets/icons/square.svg" alt="Square" />
        </button>
        <button class="shape-menu-btn" id="addRectangle" title="Rectangle">
          <img src="./assets/icons/rectangle.svg" alt="Rectangle" />
        </button>
        <!-- Rounded Square: Phase 3 placeholder, see docs/TASKS.md P3-2 -->
        <button
          class="shape-menu-btn"
          id="addRoundedSquare"
          title="Rounded Square"
          style="display: none"
        >
          <img src="./assets/icons/rounded-square.svg" alt="Rounded Square" />
        </button>
        <button class="shape-menu-btn" id="addCircle" title="Circle">
          <img src="./assets/icons/circle.svg" alt="Circle" />
        </button>
        <!-- Diamond: Phase 3 placeholder, see docs/TASKS.md P3-2 -->
        <button
          class="shape-menu-btn"
          id="addDiamond"
          title="Diamond"
          style="display: none"
        >
          <img src="./assets/icons/diamond.svg" alt="Diamond" />
        </button>
        <button class="shape-menu-btn" id="addStar" title="Star">
          <img src="./assets/icons/star.svg" alt="Star" />
        </button>
        <button class="shape-menu-btn" id="addTriangle" title="Triangle">
          <img src="./assets/icons/triangle.svg" alt="Triangle" />
        </button>
        <!--
          Speech Bubble and Arrowed Box: Phase 3 placeholders, see
          docs/TASKS.md P3-2.
        -->
        <button
          class="shape-menu-btn"
          id="addSpeechBubble"
          title="Speech Bubble"
          style="display: none"
        >
          <img src="./assets/icons/speech-bubble.svg" alt="Speech Bubble" />
        </button>
        <button
          class="shape-menu-btn"
          id="addArrowedBox"
          title="Arrowed Box"
          style="display: none"
        >
          <img src="./assets/icons/arrowed-box.svg" alt="Arrowed Box" />
        </button>
      </div>
      <!-- "More shapes" has no handler yet; hidden until Phase 3 (P3-2). -->
      <button class="shapes-menu-more-btn" style="display: none">
        More shapes
      </button>
    </div>

    <!-- Zoom Controls: Bottom Right -->
    <div class="zoom-controls" id="zoomControls">
      <button class="zoom-btn" id="zoomOut" title="Zoom Out (Ctrl/Cmd -)">
        &minus;
      </button>
      <span class="zoom-percentage" id="zoomPercentage">100%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom In (Ctrl/Cmd +)">
        +
      </button>
      <button class="zoom-btn" id="zoomReset" title="Reset Zoom (Ctrl/Cmd 0)">
        ↺
      </button>
      <button class="zoom-btn" id="zoomFit" title="Zoom to Fit">⊞</button>
      <button class="zoom-help-btn" id="zoomHelpBtn" title="Zoom Help">
        ?
      </button>
    </div>

    <!-- Properties Panel (bottom left) -->
    <div class="properties-panel" id="propertiesPanel" style="display: none">
      <form id="propertiesForm">
        <label for="itemName">Name</label>
        <input type="text" id="itemName" />
        <span class="divider"></span>
        <label for="backgroundColor">BG</label>
        <input type="color" id="backgroundColor" />
        <label for="strokeColor">Stroke</label>
        <input type="color" id="strokeColor" />
        <label for="strokeWidth">Width</label>
        <input
          type="number"
          id="strokeWidth"
          min="0"
          max="10"
          style="width: 36px"
        />
        <span class="divider"></span>
        <img
          src="./assets/icons/delete.svg"
          id="deleteBtn"
          class="delete-icon"
          alt="Delete"
          title="Delete"
        />
      </form>
    </div>

    <!-- Canvas Area -->
    <div class="canvas-area-container">
      <div id="container" class="canvas-area"></div>
      <!-- Add your first object card -->
      <div class="add-first-object-card" id="addFirstObjectCard">
        <img src="./assets/icons/add-object.svg" alt="Add Object" height="48" />
        <div>Add your first object</div>
        <button class="close-card" id="closeAddObjectCard">×</button>
      </div>
    </div>

    <!-- Export Dialog (docs/TASKS.md P1-8) -->
    <div
      class="modal fade"
      id="exportModal"
      tabindex="-1"
      aria-labelledby="exportModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content export-dialog">
          <div class="modal-header">
            <h5 class="modal-title" id="exportModalLabel">Export</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="export-preview">
              <img id="exportPreviewImg" alt="Export preview" />
              <div class="export-preview-empty" id="exportPreviewEmpty">
                Nothing to export
              </div>
            </div>

            <div class="export-options">
              <fieldset class="export-format-group">
                <legend>Format</legend>
                <label
                  ><input
                    type="radio"
                    name="exportFormat"
                    id="exportFormatPng"
                    value="png"
                    checked
                  />
                  PNG</label
                >
                <label
                  ><input
                    type="radio"
                    name="exportFormat"
                    id="exportFormatJpeg"
                    value="jpeg"
                  />
                  JPEG</label
                >
                <label
                  ><input
                    type="radio"
                    name="exportFormat"
                    id="exportFormatPdf"
                    value="pdf"
                  />
                  PDF</label
                >
              </fieldset>

              <div class="export-option-row">
                <label for="exportScale">Scale</label>
                <select id="exportScale">
                  <option value="1">1x</option>
                  <option value="2" selected>2x</option>
                  <option value="3">3x</option>
                  <option value="4">4x</option>
                </select>
              </div>

              <div class="export-option-row" id="exportTransparentRow">
                <label
                  ><input type="checkbox" id="exportTransparent" checked />
                  Transparent background</label
                >
              </div>
              <div class="export-option-row" id="exportBackgroundRow">
                <label for="exportBackgroundColor">Background color</label>
                <input
                  type="color"
                  id="exportBackgroundColor"
                  value="#ffffff"
                />
              </div>

              <div class="export-option-row">
                <label
                  ><input type="checkbox" id="exportSelectionOnly" /> Selected
                  object only</label
                >
              </div>

              <div id="exportPdfOptions" style="display: none">
                <div class="export-option-row">
                  <label for="exportPageSize">Page size</label>
                  <select id="exportPageSize">
                    <option value="fit" selected>Fit to content</option>
                    <option value="a4">A4</option>
                    <option value="letter">Letter</option>
                  </select>
                </div>
                <div class="export-option-row" id="exportOrientationRow">
                  <label for="exportOrientation">Orientation</label>
                  <select id="exportOrientation">
                    <option value="landscape" selected>Landscape</option>
                    <option value="portrait">Portrait</option>
                  </select>
                </div>
                <div class="export-option-row">
                  <label
                    ><input type="checkbox" id="exportSelectableText" checked />
                    Selectable text</label
                  >
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <span class="export-error" id="exportError"></span>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="exportConfirmBtn">
              Export
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
